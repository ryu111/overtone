<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova 自主循環</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a12; color: #e0def4; font-family: -apple-system, system-ui, monospace; min-height: 100vh; padding: 20px; }
a { color: #a78bfa; text-decoration: none; }
a:hover { text-decoration: underline; }

.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.header h1 { font-size: 20px; color: #7c3aed; }
.header .back { font-size: 13px; color: #6b7280; }

/* 狀態卡片 */
.status-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.status-card {
  background: #111122; border: 1px solid #1e1e3a; border-radius: 10px;
  padding: 14px 16px; text-align: center;
}
.status-card .label { font-size: 11px; color: #6b7280; margin-bottom: 6px; }
.status-card .value { font-size: 22px; font-weight: 700; }
.status-card .sub { font-size: 11px; color: #6b7280; margin-top: 4px; }
.green { color: #34d399; }
.yellow { color: #fbbf24; }
.red { color: #f87171; }
.dim { color: #6b7280; }

/* 循環圖 */
.loop-section { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.loop-viz {
  background: #111122; border: 1px solid #1e1e3a; border-radius: 10px;
  padding: 20px; min-height: 280px; position: relative;
}
.loop-viz h3 { font-size: 14px; color: #7c3aed; margin-bottom: 16px; }

.loop-step {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border-radius: 8px; margin-bottom: 6px; font-size: 12px;
  background: #0d0d1a; border: 1px solid #1e1e3a;
  transition: all 0.3s;
}
.loop-step.active { border-color: #7c3aed; background: rgba(124,58,237,0.1); }
.loop-step .icon { font-size: 16px; width: 24px; text-align: center; }
.loop-step .arrow { color: #4b5563; margin-left: auto; }

/* Notion 任務 */
.notion-panel {
  background: #111122; border: 1px solid #1e1e3a; border-radius: 10px;
  padding: 20px;
}
.notion-panel h3 { font-size: 14px; color: #7c3aed; margin-bottom: 12px; }
.task-item {
  padding: 8px 12px; border-radius: 6px; margin-bottom: 6px;
  background: #0d0d1a; border-left: 3px solid #4b5563; font-size: 12px;
}
.task-item.todo { border-left-color: #fbbf24; }
.task-item.doing { border-left-color: #3b82f6; }
.task-item .priority { font-size: 10px; color: #6b7280; }

/* 活動日誌 */
.bottom-row { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.log-panel {
  background: #111122; border: 1px solid #1e1e3a; border-radius: 10px;
  padding: 16px; max-height: 300px; overflow-y: auto;
}
.log-panel h3 { font-size: 14px; color: #7c3aed; margin-bottom: 10px; }
.log-entry { font-size: 11px; padding: 4px 0; border-bottom: 1px solid #1a1a2e; line-height: 1.5; }
.log-entry .ts { color: #4b5563; }

/* 統計 */
.stats-panel {
  background: #111122; border: 1px solid #1e1e3a; border-radius: 10px;
  padding: 16px;
}
.stats-panel h3 { font-size: 14px; color: #7c3aed; margin-bottom: 10px; }
.stat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; border-bottom: 1px solid #1a1a2e; }
.stat-row .k { color: #9ca3af; }
.stat-row .v { font-weight: 600; }

/* 倒數環 */
.countdown-ring { display: inline-flex; align-items: center; gap: 6px; }
.ring-svg { width: 36px; height: 36px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: #1e1e3a; stroke-width: 3; }
.ring-fg { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
</style>
</head>
<body>

<div class="header">
  <h1>自主循環進度表</h1>
  <a class="back" href="/">← Dashboard</a>
</div>

<!-- 狀態卡片 -->
<div class="status-row">
  <div class="status-card">
    <div class="label">心跳狀態</div>
    <div class="value" id="hb-status">--</div>
    <div class="sub" id="hb-sub"></div>
  </div>
  <div class="status-card">
    <div class="label">下次 Poll</div>
    <div class="value" id="poll-countdown">--</div>
    <div class="sub">每 60 秒</div>
  </div>
  <div class="status-card">
    <div class="label">自驅冷卻</div>
    <div class="value" id="sd-countdown">--</div>
    <div class="sub">cooldown 30m</div>
  </div>
  <div class="status-card">
    <div class="label">Notion 待做</div>
    <div class="value" id="todo-count">--</div>
    <div class="sub" id="todo-name"></div>
  </div>
</div>

<!-- 循環圖 + Notion 任務 -->
<div class="loop-section">
  <div class="loop-viz">
    <h3>循環狀態</h3>
    <div class="loop-step" id="step-poll"><span class="icon">🔍</span> Poll Notion 待做<span class="arrow">→</span></div>
    <div class="loop-step" id="step-execute"><span class="icon">⚡</span> Claude 執行任務<span class="arrow">→</span></div>
    <div class="loop-step" id="step-complete"><span class="icon">✅</span> 完成 → Notion 已完成<span class="arrow">→</span></div>
    <div class="loop-step" id="step-idle"><span class="icon">💤</span> Notion 空 → idle<span class="arrow">→</span></div>
    <div class="loop-step" id="step-selfdrive"><span class="icon">🧠</span> Claude 自驅分析缺口<span class="arrow">→</span></div>
    <div class="loop-step" id="step-create"><span class="icon">📝</span> 建立 Notion 任務<span class="arrow">↩</span></div>
    <div style="margin-top: 14px; font-size: 11px; color: #4b5563;" id="loop-note"></div>
  </div>

  <div class="notion-panel">
    <h3>Notion 任務</h3>
    <div id="notion-tasks">載入中...</div>
  </div>
</div>

<!-- 活動日誌 + 統計 -->
<div class="bottom-row">
  <div class="log-panel">
    <h3>活動日誌</h3>
    <div id="log-entries">載入中...</div>
  </div>

  <div class="stats-panel">
    <h3>統計</h3>
    <div id="stats-content">載入中...</div>
  </div>
</div>

<script>
let lastPollTs = 0, lastSdTs = 0, hbExecuting = false, hbRunning = false;
let stats = null;

function fmt(sec) {
  if (sec <= 0) return '0s';
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m}m${s ? s + 's' : ''}` : `${s}s`;
}

// 決定當前活躍步驟
function getActiveStep(hb, todoCount) {
  if (!hb.running) return null;
  if (hb.executing) return 'step-execute';
  if (todoCount > 0) return 'step-poll';
  const now = Date.now();
  const sdReady = !lastSdTs || (now - lastSdTs > 1800000);
  if (sdReady) return 'step-selfdrive';
  return 'step-idle';
}

async function fetchData() {
  try {
    // 並行拉 3 個 API
    const [hRes, tRes, sRes] = await Promise.all([
      fetch('/api/processes', { signal: AbortSignal.timeout(3000) }),
      fetch('/api/notion-todo', { signal: AbortSignal.timeout(5000) }),
      fetch('/api/session-log', { signal: AbortSignal.timeout(3000) }),
    ]);

    const hData = await hRes.json();
    const tData = await tRes.json();
    const sessions = await sRes.json();

    const hb = hData.heartbeat || {};
    hbRunning = !!hb.running;
    hbExecuting = !!hb.executing;
    stats = hb.stats || null;
    if (hb.lastPoll) lastPollTs = new Date(hb.lastPoll).getTime();
    if (hb.lastSelfDrive) lastSdTs = new Date(hb.lastSelfDrive).getTime();

    // 心跳狀態
    const statusEl = document.getElementById('hb-status');
    const subEl = document.getElementById('hb-sub');
    if (!hb.running) {
      statusEl.innerHTML = '<span class="red">停止</span>';
      subEl.textContent = '';
    } else if (hb.executing) {
      statusEl.innerHTML = '<span class="yellow">執行中</span>';
      subEl.textContent = '正在跑 Claude session';
    } else {
      statusEl.innerHTML = '<span class="green">運行中</span>';
      subEl.textContent = `idle ${hb.consecutiveIdles || 0}`;
    }

    // Notion 待做
    document.getElementById('todo-count').textContent = tData.count ?? 0;
    document.getElementById('todo-name').textContent = tData.top ? tData.top.slice(0, 20) + (tData.top.length > 20 ? '…' : '') : '佇列空';

    // 循環步驟高亮
    document.querySelectorAll('.loop-step').forEach(el => el.classList.remove('active'));
    const active = getActiveStep(hb, tData.count || 0);
    if (active) document.getElementById(active)?.classList.add('active');

    // 循環說明
    const note = document.getElementById('loop-note');
    if (hb.executing) note.textContent = '🔥 Claude session 正在自主執行...';
    else if ((tData.count || 0) > 0) note.textContent = '📋 下次 poll 將認領並執行待做任務';
    else if (!lastSdTs || Date.now() - lastSdTs > 1800000) note.textContent = '🧠 下次 poll 將觸發自驅分析';
    else note.textContent = `💤 等待自驅冷卻（${fmt(Math.max(0, Math.floor((lastSdTs + 1800000 - Date.now()) / 1000)))}）`;

    // Notion 任務列表
    const taskHtml = (tData.count || 0) > 0
      ? `<div class="task-item todo"><span class="priority">待做</span> ${tData.top || '（載入中）'}</div>`
      : '<div style="color:#4b5563;font-size:12px">佇列空 — 等待自驅建立任務</div>';
    document.getElementById('notion-tasks').innerHTML = taskHtml;

    // Session 日誌
    const hbSessions = (Array.isArray(sessions) ? sessions : [])
      .filter(s => s.source === 'heartbeat')
      .slice(-10)
      .reverse();
    const logHtml = hbSessions.length > 0
      ? hbSessions.map(s => {
          const ts = s.date ? new Date(s.date).toLocaleTimeString('zh-TW') : '??';
          const color = s.status === 'success' ? 'green' : 'red';
          return `<div class="log-entry"><span class="ts">${ts}</span> <span class="${color}">${s.status}</span> ${s.task || ''}</div>`;
        }).join('')
      : '<div style="color:#4b5563;font-size:12px">尚無活動記錄</div>';
    document.getElementById('log-entries').innerHTML = logHtml;

    // 統計
    if (stats) {
      const successRate = stats.tasksExecuted > 0 ? Math.round(stats.tasksSucceeded / stats.tasksExecuted * 100) : 0;
      const sdRate = stats.selfDrives > 0 ? Math.round(stats.selfDriveSuccess / stats.selfDrives * 100) : 0;
      document.getElementById('stats-content').innerHTML = `
        <div class="stat-row"><span class="k">任務執行</span><span class="v">${stats.tasksExecuted}</span></div>
        <div class="stat-row"><span class="k">成功</span><span class="v green">${stats.tasksSucceeded}</span></div>
        <div class="stat-row"><span class="k">失敗</span><span class="v ${stats.tasksFailed > 0 ? 'red' : ''}">${stats.tasksFailed}</span></div>
        <div class="stat-row"><span class="k">成功率</span><span class="v">${successRate}%</span></div>
        <div class="stat-row"><span class="k">自驅次數</span><span class="v">${stats.selfDrives}</span></div>
        <div class="stat-row"><span class="k">自驅成功</span><span class="v green">${stats.selfDriveSuccess}</span></div>
        <div class="stat-row"><span class="k">自驅成功率</span><span class="v">${sdRate}%</span></div>
        <div class="stat-row"><span class="k">Server 啟動</span><span class="v dim">${new Date(Date.now() - (hData.heartbeat?.uptime || 0) * 1000).toLocaleTimeString('zh-TW')}</span></div>
      `;
    }
  } catch (e) {
    document.getElementById('hb-status').innerHTML = '<span class="red">離線</span>';
  }
}

function tick() {
  const now = Date.now();

  // Poll 倒數
  const pollEl = document.getElementById('poll-countdown');
  if (lastPollTs) {
    const sec = Math.max(0, Math.floor((lastPollTs + 60000 - now) / 1000));
    pollEl.textContent = fmt(sec);
    pollEl.className = 'value ' + (sec <= 5 ? 'yellow' : '');
  }

  // 自驅倒數
  const sdEl = document.getElementById('sd-countdown');
  if (lastSdTs) {
    const sec = Math.max(0, Math.floor((lastSdTs + 1800000 - now) / 1000));
    sdEl.textContent = sec > 0 ? fmt(sec) : '就緒';
    sdEl.className = 'value ' + (sec === 0 ? 'green' : '');
  } else {
    sdEl.textContent = '就緒';
    sdEl.className = 'value green';
  }
}

fetchData();
setInterval(fetchData, 5000);
setInterval(tick, 1000);
</script>
</body>
</html>
