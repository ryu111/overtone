<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova — Galaxy Pro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #818cf8;
    --accent2: #38bdf8;
    --accent3: #a78bfa;
    --text: #c4d0ff;
    --text-dim: rgba(196,208,255,0.45);
    --panel-bg: rgba(10,10,30,0.82);
    --panel-border: rgba(100,140,255,0.15);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #050510;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  #stars-canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }

  .nebula { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; }
  .nebula-1 { width: 800px; height: 600px; background: radial-gradient(ellipse, rgba(99,102,241,0.07), transparent 70%); top: -200px; left: -100px; }
  .nebula-2 { width: 700px; height: 700px; background: radial-gradient(ellipse, rgba(56,189,248,0.05), transparent 70%); bottom: -150px; right: -100px; }
  .nebula-3 { width: 500px; height: 500px; background: radial-gradient(ellipse, rgba(167,139,250,0.05), transparent 70%); top: 40%; left: 40%; }

  .app {
    position: relative; z-index: 1;
    padding: 24px 28px 80px;
    max-width: 1500px; margin: 0 auto;
  }

  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: rgba(100,120,255,0.65); text-decoration: none; font-size: 13px;
    margin-bottom: 20px; letter-spacing: 0.5px; transition: color 0.3s;
  }
  .back-link:hover { color: #818cf8; }

  /* Header */
  .page-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  .title-wrap { display: flex; align-items: center; gap: 14px; }
  .title-icon {
    width: 46px; height: 46px;
    background: radial-gradient(circle, rgba(99,102,241,0.55), rgba(99,102,241,0.1));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    box-shadow: 0 0 24px rgba(99,102,241,0.45);
    animation: pulseIcon 3s ease-in-out infinite;
  }
  @keyframes pulseIcon {
    0%,100% { box-shadow: 0 0 24px rgba(99,102,241,0.45); }
    50% { box-shadow: 0 0 45px rgba(99,102,241,0.75), 0 0 70px rgba(99,102,241,0.2); }
  }
  .page-title h1 {
    font-size: clamp(18px, 2.2vw, 26px); font-weight: 700;
    background: linear-gradient(135deg, #818cf8, #c4b5fd, #93c5fd);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .page-subtitle { font-size: 11px; color: var(--text-dim); margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }
  .header-right { text-align: right; }
  .header-right .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  #clock { font-size: 20px; font-weight: 300; color: rgba(196,208,255,0.75); font-variant-numeric: tabular-nums; }

  /* Panel */
  .panel {
    background: var(--panel-bg);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 20px 24px;
    animation: floatPanel 6s ease-in-out infinite, fadeSlideIn 0.5s ease-out backwards;
    transition: border-color 0.3s;
    position: relative; overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(130,160,255,0.35), transparent);
  }
  .panel:hover { border-color: rgba(100,140,255,0.35); }
  @keyframes floatPanel {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid rgba(100,140,255,0.12); }
  .tab {
    padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 500;
    color: #6b7280; border-bottom: 2px solid transparent;
    transition: all 0.2s; background: none; border-top: none; border-left: none; border-right: none;
    letter-spacing: 0.3px;
  }
  .tab:hover { color: #e0def4; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; animation: fadeIn 0.3s; }
  .tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Panel title */
  .panel-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--text-dim); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .panel-title::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(100,140,255,0.2), transparent);
  }

  /* Section grid */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }

  /* Activity Rings */
  .rings-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
  .ring-card {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 20px 12px;
    background: rgba(20,20,50,0.6);
    border: 1px solid rgba(100,140,255,0.1);
    border-radius: 12px;
  }
  .ring-card svg { overflow: visible; }
  .ring-label { font-size: 12px; color: var(--text-dim); text-align: center; }
  .ring-value { font-size: 22px; font-weight: 700; text-align: center; }

  /* Distribution bar */
  .dist-bar-wrap { margin-bottom: 16px; }
  .dist-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .dist-bar { height: 8px; border-radius: 4px; background: rgba(100,140,255,0.12); overflow: hidden; }
  .dist-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }

  /* Score table */
  .score-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .score-table th {
    text-align: left; padding: 8px 10px; font-size: 10px;
    text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim);
    border-bottom: 1px solid rgba(100,140,255,0.1);
  }
  .score-table td { padding: 8px 10px; border-bottom: 1px solid rgba(100,140,255,0.06); }
  .score-table tr:hover td { background: rgba(100,140,255,0.04); }
  .score-table td:first-child { color: rgba(196,208,255,0.7); font-size: 11px; }

  /* Grade badge */
  .grade {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
  }
  .grade-A { background: rgba(52,211,153,0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.2); }
  .grade-B { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.2); }
  .grade-C { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
  .grade-D { background: rgba(249,115,22,0.15); color: #fb923c; border: 1px solid rgba(249,115,22,0.2); }
  .grade-F { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }

  /* Score bar cell */
  .score-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .score-bar-bg { flex: 1; height: 4px; background: rgba(100,140,255,0.12); border-radius: 2px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 2px; transition: width 0.8s ease; }
  .score-num { font-size: 13px; font-weight: 600; color: var(--text); min-width: 28px; text-align: right; }

  /* Sparkline */
  .sparkline-wrap { display: flex; align-items: flex-end; gap: 3px; height: 36px; }
  .spark-bar { flex: 1; min-width: 6px; border-radius: 2px 2px 0 0; transition: height 0.5s; }

  /* Error cluster */
  .error-cluster-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.1);
    margin-bottom: 8px; font-size: 12px;
  }
  .error-dot { width: 8px; height: 8px; border-radius: 50%; background: #f87171; flex-shrink: 0; }
  .error-msg { flex: 1; color: rgba(196,208,255,0.7); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .error-count { font-weight: 600; color: #f87171; font-size: 11px; }

  /* Git commit */
  .commit-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    background: rgba(20,20,50,0.5); border: 1px solid rgba(100,140,255,0.08);
    margin-bottom: 8px; font-size: 12px;
  }
  .commit-hash { color: var(--accent2); font-family: monospace; font-size: 10px; padding-top: 2px; flex-shrink: 0; }
  .commit-subject { flex: 1; color: rgba(196,208,255,0.8); }
  .commit-date { color: var(--text-dim); font-size: 10px; flex-shrink: 0; }

  /* Session card */
  .session-card {
    padding: 12px 16px; border-radius: 10px;
    background: rgba(20,20,50,0.5); border: 1px solid rgba(100,140,255,0.1);
    margin-bottom: 10px;
  }
  .session-meta { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .session-id { font-size: 11px; color: var(--accent); font-family: monospace; }
  .session-time { font-size: 10px; color: var(--text-dim); }
  .session-summary { font-size: 12px; color: rgba(196,208,255,0.65); line-height: 1.5; }

  /* Status indicators */
  .status-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px;
    background: rgba(20,20,50,0.5); border: 1px solid rgba(100,140,255,0.08);
    margin-bottom: 8px; font-size: 12px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .dot-green { background: #34d399; box-shadow: 0 0 6px rgba(52,211,153,0.6); }
  .dot-red { background: #f87171; box-shadow: 0 0 6px rgba(248,113,113,0.6); }
  .dot-yellow { background: #fbbf24; box-shadow: 0 0 6px rgba(251,191,36,0.6); }
  .dot-gray { background: #6b7280; }
  .status-name { flex: 1; color: var(--text); }
  .status-detail { font-size: 10px; color: var(--text-dim); }

  /* Confidence bar */
  .confidence-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .confidence-label { font-size: 12px; color: rgba(196,208,255,0.7); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .confidence-bar-bg { width: 80px; height: 4px; background: rgba(100,140,255,0.12); border-radius: 2px; overflow: hidden; }
  .confidence-bar-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.8s; }
  .confidence-pct { font-size: 11px; color: var(--text-dim); min-width: 32px; text-align: right; }

  /* Action buttons */
  .action-btn {
    width: 100%; padding: 10px 16px; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 500; transition: all 0.2s;
    border: 1px solid rgba(100,140,255,0.2);
    background: rgba(99,102,241,0.08);
    color: var(--accent); margin-bottom: 8px; text-align: left;
    display: flex; align-items: center; gap: 8px;
  }
  .action-btn:hover {
    background: rgba(99,102,241,0.15);
    border-color: rgba(100,140,255,0.4);
    transform: translateX(2px);
  }

  /* Lock badge */
  .lock-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 6px;
    background: rgba(20,20,50,0.5); border: 1px solid rgba(100,140,255,0.08);
    margin-bottom: 6px; font-size: 11px;
  }
  .lock-name { flex: 1; color: var(--text-dim); font-family: monospace; font-size: 10px; }
  .lock-badge {
    padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600;
  }
  .lock-active { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .lock-clear { background: rgba(52,211,153,0.12); color: #34d399; }

  /* Improvement item */
  .improve-item {
    padding: 10px 12px; border-radius: 8px;
    background: rgba(167,139,250,0.06); border: 1px solid rgba(167,139,250,0.12);
    margin-bottom: 8px; font-size: 12px; color: rgba(196,208,255,0.75); line-height: 1.5;
  }
  .improve-meta { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }

  /* Top-5 bar chart */
  .bar-chart { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-name { font-size: 11px; color: var(--text-dim); width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
  .bar-bg { flex: 1; height: 18px; background: rgba(100,140,255,0.1); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
  .bar-val { font-size: 11px; color: var(--text-dim); min-width: 36px; text-align: right; flex-shrink: 0; }

  .empty-state {
    text-align: center; padding: 24px; color: var(--text-dim); font-size: 13px;
  }

  .section-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .section-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .section-count { font-size: 11px; color: var(--text-dim); }

  .col-title { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.8px; }

  @media (max-width: 900px) {
    .rings-grid { grid-template-columns: repeat(2, 1fr); }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-3, .grid-2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .rings-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<div class="nebula nebula-1"></div>
<div class="nebula nebula-2"></div>
<div class="nebula nebula-3"></div>

<div class="app">
  <a href="/gallery.html" class="back-link">← Gallery</a>

  <div class="page-header">
    <div class="title-wrap">
      <div class="title-icon">✦</div>
      <div class="page-title">
        <h1>Nova Intelligence</h1>
        <div class="page-subtitle">Galaxy Pro · Star Command</div>
      </div>
    </div>
    <div class="header-right">
      <div class="label">系統時間</div>
      <div id="clock">--:--:--</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab" data-tab="overview">總覽</button>
    <button class="tab" data-tab="quality">品質</button>
    <button class="tab" data-tab="monitor">監控</button>
    <button class="tab" data-tab="system">系統</button>
  </div>

  <!-- Tab 1: 總覽 -->
  <div id="overview" class="tab-content">
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-title">系統活力指標</div>
      <div class="rings-grid" id="rings-grid">
        <!-- filled by JS -->
      </div>
    </div>

    <div class="grid-2" style="margin-bottom:16px">
      <div class="panel">
        <div class="panel-title">品質分布</div>
        <div id="dist-chart"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Script TOP 5（行數）</div>
        <div class="bar-chart" id="script-top5"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">最近 Session</div>
      <div id="recent-sessions"></div>
    </div>
  </div>

  <!-- Tab 2: 品質 -->
  <div id="quality" class="tab-content">
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-title">完整評分排行（依 Total 排序）</div>
      <div style="overflow-x:auto">
        <table class="score-table" id="full-score-table">
          <thead>
            <tr>
              <th>元件</th>
              <th>Total</th>
              <th>Grade</th>
              <th>分布</th>
            </tr>
          </thead>
          <tbody id="score-tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">改善建議</div>
      <div id="improvements-list"></div>
    </div>
  </div>

  <!-- Tab 3: 監控 -->
  <div id="monitor" class="tab-content">
    <div class="grid-2" style="margin-bottom:16px">
      <div class="panel">
        <div class="panel-title">錯誤聚類</div>
        <div id="error-clusters"></div>
        <div style="margin-top:14px">
          <div class="panel-title">7 天趨勢</div>
          <div class="sparkline-wrap" id="sparkline"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Git 活動</div>
        <div class="grid-2">
          <div>
            <div class="col-title">nova</div>
            <div id="git-nova"></div>
          </div>
          <div>
            <div class="col-title">overtone</div>
            <div id="git-overtone"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">Session 列表</div>
      <div id="session-list"></div>
    </div>
  </div>

  <!-- Tab 4: 系統 -->
  <div id="system" class="tab-content">
    <div class="grid-2" style="margin-bottom:16px">
      <div class="panel">
        <div class="panel-title">服務狀態</div>
        <div id="service-status"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Lock 狀態</div>
        <div id="lock-status"></div>
        <button class="action-btn" style="margin-top:10px" onclick="clearLocks()">
          🔓 清除過期 Lock
        </button>
      </div>
    </div>

    <div class="grid-2" style="margin-bottom:16px">
      <div class="panel">
        <div class="panel-title">行為模式</div>
        <div id="behavior-list"></div>
      </div>
      <div class="panel">
        <div class="panel-title">操作</div>
        <button class="action-btn" onclick="doAction('reload-modules')">⟳ 重載 Hook 模組</button>
        <button class="action-btn" onclick="doAction('trigger-maintainer')">⚡ 觸發 Maintainer</button>
        <button class="action-btn" onclick="location.reload()">↺ 刷新頁面</button>
      </div>
    </div>
  </div>
</div><!-- /app -->

<!-- Stars canvas -->
<script>
(function() {
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [], shootingStars = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // 3 layers for parallax
  function initStars() {
    stars = [];
    const counts = [120, 100, 80];
    const speeds = [0.05, 0.12, 0.22];
    const sizes = [0.6, 1.0, 1.5];
    for (let layer = 0; layer < 3; layer++) {
      for (let i = 0; i < counts[layer]; i++) {
        const isBright = i < 10 && layer === 2;
        stars.push({
          x: Math.random() * W, y: Math.random() * H,
          r: isBright ? (Math.random() * 1.5 + 1.5) : (Math.random() * sizes[layer] + 0.3),
          speed: speeds[layer] * (0.8 + Math.random() * 0.4),
          opacity: Math.random() * 0.4 + 0.4,
          twinkle: Math.random() * Math.PI * 2,
          bright: isBright,
          layer,
        });
      }
    }
  }
  initStars();

  function drawShootingStar() {
    if (Math.random() > 0.997) {
      const x = Math.random() * W;
      const y = Math.random() * H * 0.5;
      shootingStars.push({ x, y, life: 1.0, vx: 3 + Math.random() * 3, vy: 1.5 + Math.random() * 1.5 });
    }
  }

  let frameCount = 0;
  function animate() {
    requestAnimationFrame(animate);
    ctx.clearRect(0, 0, W, H);
    frameCount++;

    // Draw stars
    for (const s of stars) {
      s.twinkle += 0.02;
      const op = s.opacity * (0.7 + 0.3 * Math.sin(s.twinkle));
      ctx.save();
      if (s.bright) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#a0b8ff';
      }
      ctx.globalAlpha = op;
      ctx.fillStyle = s.bright ? '#e8f0ff' : '#c4d0ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      s.y += s.speed;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }

    // Shooting stars
    drawShootingStar();
    shootingStars = shootingStars.filter(ss => ss.life > 0);
    for (const ss of shootingStars) {
      ctx.save();
      ctx.globalAlpha = ss.life;
      ctx.beginPath();
      ctx.moveTo(ss.x, ss.y);
      ctx.lineTo(ss.x + 80 * (1 - ss.life * 0.5), ss.y + 40 * (1 - ss.life * 0.5));
      const grad = ctx.createLinearGradient(ss.x, ss.y, ss.x + 80, ss.y + 40);
      grad.addColorStop(0, 'rgba(255,255,255,0.85)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
      ss.x += ss.vx;
      ss.y += ss.vy;
      ss.life -= 0.03;
    }
  }
  animate();
})();
</script>

<!-- Tab system -->
<script>
function initTabs(key) {
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.tab-content');
  const saved = localStorage.getItem(key);
  function activate(id) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === id));
    panels.forEach(p => p.classList.toggle('active', p.id === id));
    localStorage.setItem(key, id);
  }
  tabs.forEach(t => t.addEventListener('click', () => activate(t.dataset.tab)));
  activate(saved || tabs[0]?.dataset.tab);
}
initTabs('g3-tab');
</script>

<!-- Shared fetch -->
<script>
async function fetchApi(ep) {
  try {
    const r = await fetch(`/api/${ep}`, { signal: AbortSignal.timeout(5000) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const ct = r.headers.get('content-type') || '';
    return ct.includes('json') ? await r.json() : await r.text();
  } catch (e) { console.error(`API ${ep}:`, e.message); return null; }
}
</script>

<!-- Data & render -->
<script>
let _data = {};

// ---- Helpers ----
function gradeFrom(score) {
  if (score >= 90) return 'A';
  if (score >= 80) return 'B';
  if (score >= 70) return 'C';
  if (score >= 60) return 'D';
  return 'F';
}
function gradeColor(g) {
  return { A:'#34d399', B:'#60a5fa', C:'#fbbf24', D:'#fb923c', F:'#f87171' }[g] || '#6b7280';
}
function scoreBarColor(s) {
  if (s >= 90) return '#34d399';
  if (s >= 70) return '#60a5fa';
  if (s >= 50) return '#fbbf24';
  return '#f87171';
}

// Count-up animation
function animateCount(el, target, duration = 900) {
  const start = performance.now();
  const update = (now) => {
    const p = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3); // easeOutCubic
    el.textContent = Math.round(eased * target);
    if (p < 1) requestAnimationFrame(update);
  };
  requestAnimationFrame(update);
}

// SVG Activity Ring
function makeRing(pct, color, size = 100) {
  const r = 38, cx = 50, cy = 50;
  const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(100,140,255,0.1)" stroke-width="9"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}"
      stroke-dashoffset="0"
      stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})"
      style="transition: stroke-dasharray 1.2s ease"/>
  </svg>`;
}

// ---- Render Functions ----

function renderRings(scores, errors, components) {
  const grid = document.getElementById('rings-grid');
  if (!grid) return;

  const avgScore = scores && scores.length
    ? (scores.reduce((s, x) => s + (x.total || x.score || 0), 0) / scores.length)
    : 0;
  const errCount = errors ? errors.length : 0;
  const health = Math.max(0, Math.min(100, Math.round(avgScore * 0.7 + (100 - Math.min(errCount * 10, 100)) * 0.3)));
  const quality = Math.round(avgScore);
  const stability = Math.max(0, 100 - errCount * 8);
  const compTotal = components ? (components.rules + components.skills + components.agents + components.hookModules) : 0;
  const compPct = Math.min(100, Math.round(compTotal / 50 * 100));

  const items = [
    { label: '健康度', value: health, color: '#34d399' },
    { label: '品質分', value: quality, color: '#818cf8' },
    { label: '穩定度', value: stability, color: '#38bdf8' },
    { label: '元件率', value: compPct, color: '#a78bfa' },
  ];

  grid.innerHTML = items.map(it => `
    <div class="ring-card">
      <div style="position:relative;width:100px;height:100px">
        ${makeRing(it.value, it.color)}
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center">
          <div class="ring-value" style="color:${it.color};font-size:18px" id="rv-${it.label}">0</div>
          <div style="font-size:9px;color:var(--text-dim);margin-top:1px">%</div>
        </div>
      </div>
      <div class="ring-label">${it.label}</div>
    </div>
  `).join('');

  // Animate numbers
  items.forEach(it => {
    const el = document.getElementById(`rv-${it.label}`);
    if (el) animateCount(el, it.value);
  });
}

function renderDistChart(scores) {
  const el = document.getElementById('dist-chart');
  if (!el) return;
  if (!scores || !scores.length) { el.innerHTML = '<div class="empty-state">資料不可用</div>'; return; }

  const counts = { A:0, B:0, C:0, D:0, F:0 };
  scores.forEach(s => { const g = gradeFrom(s.total || s.score || 0); counts[g]++; });
  const total = scores.length;
  const colors = { A:'#34d399', B:'#60a5fa', C:'#fbbf24', D:'#fb923c', F:'#f87171' };

  el.innerHTML = Object.entries(counts).map(([g, cnt]) => {
    const pct = total ? ((cnt / total) * 100).toFixed(1) : 0;
    return `
      <div class="dist-bar-wrap">
        <div class="dist-label">
          <span style="color:${colors[g]};font-weight:600">Grade ${g}</span>
          <span>${cnt} (${pct}%)</span>
        </div>
        <div class="dist-bar">
          <div class="dist-fill" style="width:${pct}%;background:${colors[g]}"></div>
        </div>
      </div>
    `;
  }).join('');
}

function renderScriptTop5(scripts) {
  const el = document.getElementById('script-top5');
  if (!el) return;
  if (!scripts || !scripts.length) { el.innerHTML = '<div class="empty-state">資料不可用</div>'; return; }
  const top5 = [...scripts].sort((a,b) => b.lines - a.lines).slice(0, 5);
  const max = top5[0]?.lines || 1;
  const colors = ['#818cf8','#a78bfa','#38bdf8','#34d399','#fbbf24'];
  el.innerHTML = top5.map((s, i) => `
    <div class="bar-row">
      <div class="bar-name" title="${s.name}">${s.name.replace('.js','')}</div>
      <div class="bar-bg">
        <div class="bar-fill" style="width:${(s.lines/max*100).toFixed(1)}%;background:${colors[i]};opacity:0.8"></div>
      </div>
      <div class="bar-val">${s.lines}</div>
    </div>
  `).join('');
}

function renderRecentSessions(sessions) {
  const el = document.getElementById('recent-sessions');
  if (!el) return;
  if (!sessions || !sessions.length) { el.innerHTML = '<div class="empty-state">資料不可用</div>'; return; }
  const recent = [...sessions].slice(-3).reverse();
  el.innerHTML = recent.map(s => `
    <div class="session-card">
      <div class="session-meta">
        <span class="session-id">${(s.session_id || s.id || 'unknown').slice(0,8)}...</span>
        <span class="session-time">${s.timestamp ? new Date(s.timestamp).toLocaleString('zh-TW') : ''}</span>
      </div>
      <div class="session-summary">${s.summary || s.content || '無摘要'}</div>
    </div>
  `).join('');
}

function renderFullScoreTable(scores) {
  const tbody = document.getElementById('score-tbody');
  if (!tbody) return;
  if (!scores || !scores.length) { tbody.innerHTML = '<tr><td colspan="4" class="empty-state">資料不可用</td></tr>'; return; }
  const sorted = [...scores].sort((a,b) => (b.total||b.score||0) - (a.total||a.score||0));
  const maxScore = sorted[0] ? (sorted[0].total || sorted[0].score || 100) : 100;
  tbody.innerHTML = sorted.map(s => {
    const score = s.total || s.score || 0;
    const g = gradeFrom(score);
    const color = scoreBarColor(score);
    const name = (s.path || s.name || 'unknown').split('/').pop().replace('.md','').replace('.js','');
    return `<tr>
      <td title="${s.path || s.name}">${name}</td>
      <td>
        <div class="score-bar-wrap">
          <div class="score-bar-bg"><div class="score-bar-fill" style="width:${(score/maxScore*100).toFixed(1)}%;background:${color}"></div></div>
          <span class="score-num">${score}</span>
        </div>
      </td>
      <td><span class="grade grade-${g}">${g}</span></td>
      <td style="color:var(--text-dim);font-size:11px">${s.type || s.category || '-'}</td>
    </tr>`;
  }).join('');
}

function renderImprovements(improvements) {
  const el = document.getElementById('improvements-list');
  if (!el) return;
  if (!improvements || !improvements.length) { el.innerHTML = '<div class="empty-state">資料不可用</div>'; return; }
  el.innerHTML = improvements.slice(-8).reverse().map(im => `
    <div class="improve-item">
      <div class="improve-meta">${im.timestamp ? new Date(im.timestamp).toLocaleString('zh-TW') : ''} · ${im.component || im.path || ''}</div>
      ${im.suggestion || im.content || im.text || ''}
    </div>
  `).join('');
}

function renderErrorClusters(errors) {
  const el = document.getElementById('error-clusters');
  if (!el) return;
  if (!errors || !errors.length) { el.innerHTML = '<div class="empty-state" style="font-size:12px;color:#34d399">無錯誤記錄</div>'; return; }
  const clusters = {};
  errors.forEach(e => {
    const key = (e.error || e.message || 'unknown').slice(0, 40);
    clusters[key] = (clusters[key] || 0) + 1;
  });
  const sorted = Object.entries(clusters).sort((a,b) => b[1]-a[1]).slice(0, 5);
  el.innerHTML = sorted.map(([msg, cnt]) => `
    <div class="error-cluster-item">
      <div class="error-dot"></div>
      <div class="error-msg">${msg}</div>
      <div class="error-count">×${cnt}</div>
    </div>
  `).join('');
}

function renderSparkline(errors) {
  const el = document.getElementById('sparkline');
  if (!el) return;
  // Build 7-day counts
  const dayCounts = new Array(7).fill(0);
  const now = Date.now();
  if (errors) {
    errors.forEach(e => {
      const ts = new Date(e.ts || e.timestamp || 0).getTime();
      const daysAgo = Math.floor((now - ts) / 86400000);
      if (daysAgo >= 0 && daysAgo < 7) dayCounts[6 - daysAgo]++;
    });
  }
  const max = Math.max(...dayCounts, 1);
  const colors = ['#38bdf8','#38bdf8','#818cf8','#818cf8','#a78bfa','#a78bfa','#c4b5fd'];
  el.innerHTML = dayCounts.map((c, i) => {
    const pct = Math.max(4, (c / max * 100)).toFixed(0);
    return `<div class="spark-bar" style="height:${pct}%;background:${colors[i]};opacity:0.7" title="${c} 錯誤"></div>`;
  }).join('');
}

function renderGitActivity(git) {
  ['nova', 'overtone'].forEach(repo => {
    const el = document.getElementById(`git-${repo}`);
    if (!el) return;
    const commits = git?.[repo] || [];
    if (!commits.length) { el.innerHTML = '<div class="empty-state" style="font-size:11px">無資料</div>'; return; }
    el.innerHTML = commits.slice(0, 5).map(c => `
      <div class="commit-item">
        <div class="commit-hash">${(c.hash||'').slice(0,7)}</div>
        <div class="commit-subject">${c.subject || ''}</div>
      </div>
    `).join('');
  });
}

function renderSessionList(sessions) {
  const el = document.getElementById('session-list');
  if (!el) return;
  if (!sessions || !sessions.length) { el.innerHTML = '<div class="empty-state">資料不可用</div>'; return; }
  el.innerHTML = [...sessions].slice(-6).reverse().map(s => `
    <div class="session-card" style="margin-bottom:8px">
      <div class="session-meta">
        <span class="session-id">${(s.session_id||s.id||'').slice(0,12)}...</span>
        <span class="session-time">${s.timestamp ? new Date(s.timestamp).toLocaleDateString('zh-TW') : ''}</span>
      </div>
      <div class="session-summary">${(s.summary||s.content||'').slice(0,100)}${(s.summary||s.content||'').length>100?'...':''}</div>
    </div>
  `).join('');
}

function renderServiceStatus(health) {
  const el = document.getElementById('service-status');
  if (!el) return;
  const ok = health && health.status === 'ok';
  const services = [
    { name: 'Nova Server', status: ok ? 'online' : 'offline' },
    { name: 'LLM (port 8000)', status: 'checking' },
    { name: 'Maintainer', status: 'auto' },
    { name: 'Judge', status: 'auto' },
    { name: 'Hook Client', status: ok ? 'active' : 'fallback' },
  ];
  el.innerHTML = services.map(s => {
    const cls = s.status === 'online' || s.status === 'active' ? 'dot-green'
               : s.status === 'offline' || s.status === 'fallback' ? 'dot-red'
               : 'dot-yellow';
    return `<div class="status-row">
      <div class="status-dot ${cls}"></div>
      <div class="status-name">${s.name}</div>
      <div class="status-detail">${s.status}</div>
    </div>`;
  }).join('');
}

function renderLocks(locks) {
  const el = document.getElementById('lock-status');
  if (!el) return;
  if (!locks) { el.innerHTML = '<div class="empty-state" style="font-size:12px">資料不可用</div>'; return; }
  el.innerHTML = locks.map(l => {
    const name = l.path.split('/').pop();
    const cls = l.exists ? 'lock-active' : 'lock-clear';
    const label = l.exists ? `活躍 (${l.age || 0}s)` : '清除';
    return `<div class="lock-item">
      <div class="lock-name">${name}</div>
      <span class="lock-badge ${cls}">${label}</span>
    </div>`;
  }).join('');
}

function renderBehaviors(behaviors) {
  const el = document.getElementById('behavior-list');
  if (!el) return;
  if (!behaviors || !behaviors.length) { el.innerHTML = '<div class="empty-state" style="font-size:12px">資料不可用</div>'; return; }
  el.innerHTML = behaviors.slice(-8).map(b => `
    <div class="confidence-wrap">
      <div class="confidence-label" title="${b.pattern||b.behavior||''}">${b.pattern || b.behavior || ''}</div>
      <div class="confidence-bar-bg">
        <div class="confidence-bar-fill" style="width:${Math.round((b.confidence||0)*100)}%"></div>
      </div>
      <div class="confidence-pct">${Math.round((b.confidence||0)*100)}%</div>
    </div>
  `).join('');
}

// ---- Actions ----
async function postApi(ep) {
  try {
    const r = await fetch(`/api/${ep}`, { method: 'POST', signal: AbortSignal.timeout(5000) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch (e) { console.error(`POST ${ep}:`, e.message); return null; }
}
async function clearLocks() {
  const r = await postApi('actions/clear-locks');
  if (r) showToast(`已清除 ${(r.cleared||[]).length} 個 Lock ✅`);
}
async function doAction(act) {
  const r = await postApi(`actions/${act}`);
  if (r) {
    const msg = r.triggered ? '已觸發 ✅' : r.reloaded ? '已重載 ✅' : JSON.stringify(r);
    showToast(msg);
  }
}
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, {
    position:'fixed', top:'20px', right:'20px', zIndex:'9999',
    background:'rgba(99,102,241,0.9)', color:'white', padding:'10px 18px',
    borderRadius:'8px', fontSize:'13px', boxShadow:'0 4px 20px rgba(0,0,0,0.4)'
  });
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ---- Main load ----
async function loadAll() {
  const [scores, errors, sessions, improvements, scripts, git, health, locks, behaviors, components, daemons, scenarios] = await Promise.all([
    fetchApi('scores'),
    fetchApi('errors'),
    fetchApi('sessions'),
    fetchApi('improvements'),
    fetchApi('scripts'),
    fetchApi('git'),
    fetchApi('health'),
    fetchApi('locks'),
    fetchApi('behaviors'),
    fetchApi('components'),
    fetchApi('daemons'),
    fetchApi('scenarios'),
  ]);

  _data = { scores, errors, sessions, improvements, scripts, git, health, locks, behaviors, components, daemons, scenarios };

  // Tab 1
  renderRings(scores, errors, components);
  renderDistChart(scores);
  renderScriptTop5(scripts);
  renderRecentSessions(sessions);

  // Tab 2
  renderFullScoreTable(scores);
  renderImprovements(improvements);

  // Tab 3
  renderErrorClusters(errors);
  renderSparkline(errors);
  renderGitActivity(git);
  renderSessionList(sessions);

  // Tab 4
  renderServiceStatus(health);
  renderLocks(locks);
  renderBehaviors(behaviors);
}

loadAll();
setInterval(loadAll, 30000);
</script>
