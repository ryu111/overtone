<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova — Hybrid Pro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #7c3aed;
    --accent-light: #a78bfa;
    --accent-bright: #c4b5fd;
    --accent2: #06b6d4;
    --accent3: #ec4899;
    --text: #f0e6ff;
    --text-dim: rgba(240,230,255,0.45);
    --panel-bg: rgba(255,255,255,0.04);
    --panel-border: rgba(255,255,255,0.1);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d0618;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Gradient background */
  .bg-gradient {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
    background: linear-gradient(-45deg, #0d0618, #130a2a, #0a1628, #14062e, #0d1a2e);
    background-size: 400% 400%;
    animation: gradientFlow 20s ease infinite;
  }
  @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Blobs */
  .blob {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    animation: blobFloat linear infinite;
  }
  .blob-1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,58,237,0.12), transparent 70%);
    filter: blur(80px);
    top: -100px; left: -200px;
    animation-duration: 25s;
  }
  .blob-2 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(6,182,212,0.1), transparent 70%);
    filter: blur(80px);
    bottom: -100px; right: -100px;
    animation-duration: 30s;
    animation-delay: -10s;
  }
  .blob-3 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(236,72,153,0.08), transparent 70%);
    filter: blur(80px);
    top: 40%; left: 40%;
    animation-duration: 35s;
    animation-delay: -20s;
  }
  @keyframes blobFloat {
    0%,100% { transform: translate(0,0) scale(1); }
    25% { transform: translate(30px,-40px) scale(1.05); }
    50% { transform: translate(-20px,20px) scale(0.95); }
    75% { transform: translate(40px,10px) scale(1.02); }
  }

  /* Micro particles */
  .micro-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  .app {
    position: relative; z-index: 1;
    padding: 24px 28px 80px;
    max-width: 1500px; margin: 0 auto;
  }

  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: rgba(167,139,250,0.65); text-decoration: none; font-size: 13px;
    margin-bottom: 20px; letter-spacing: 0.5px; transition: color 0.3s;
  }
  .back-link:hover { color: var(--accent-bright); }

  /* Panel */
  .panel {
    backdrop-filter: blur(24px) saturate(200%);
    -webkit-backdrop-filter: blur(24px) saturate(200%);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.35);
    padding: 20px 24px;
    transition: all 0.3s;
  }
  .panel:hover {
    transform: translateY(-4px);
    box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    border-color: rgba(124,58,237,0.2);
  }

  /* Stagger animations */
  .panel:nth-child(1) { animation: staggerIn 0.5s ease-out 0.05s backwards; }
  .panel:nth-child(2) { animation: staggerIn 0.5s ease-out 0.1s backwards; }
  .panel:nth-child(3) { animation: staggerIn 0.5s ease-out 0.15s backwards; }
  .panel:nth-child(4) { animation: staggerIn 0.5s ease-out 0.2s backwards; }
  .panel:nth-child(5) { animation: staggerIn 0.5s ease-out 0.25s backwards; }
  @keyframes staggerIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Header */
  .page-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  .title-wrap { display: flex; align-items: center; gap: 14px; }
  .title-icon {
    width: 48px; height: 48px;
    background: rgba(124,58,237,0.2); border: 1px solid rgba(124,58,237,0.4);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    box-shadow: 0 0 24px rgba(124,58,237,0.3);
    backdrop-filter: blur(10px);
    animation: iconFloat 4s ease-in-out infinite;
  }
  @keyframes iconFloat {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-4px) rotate(2deg); }
  }
  .page-title h1 {
    font-size: clamp(18px, 2.2vw, 28px); font-weight: 700;
    background: linear-gradient(135deg, #c4b5fd, #e879f9, #67e8f9, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    background-size: 200%;
    animation: shimmer 5s ease infinite;
  }
  @keyframes shimmer {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .page-subtitle { font-size: 11px; color: var(--text-dim); margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }
  .header-right { text-align: right; }
  .header-right .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  #clock { font-size: 20px; font-weight: 300; color: rgba(240,230,255,0.75); font-variant-numeric: tabular-nums; }

  /* Tabs */
  .tabs {
    display: flex; gap: 0; margin-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .tab {
    padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 500;
    color: #6b7280; border-bottom: 2px solid transparent;
    transition: all 0.2s; background: none; border-top: none; border-left: none; border-right: none;
    letter-spacing: 0.3px;
  }
  .tab:hover { color: #e0def4; }
  .tab.active { color: var(--accent-light); border-bottom-color: var(--accent-light); }
  .tab-content { display: none; animation: fadeIn 0.3s; }
  .tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Panel title */
  .panel-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--text-dim); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .panel-title::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(167,139,250,0.2), transparent);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
  .grid-3-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-col-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-col-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; margin-bottom: 16px; }

  /* Hero section */
  .hero-section {
    display: grid; grid-template-columns: 1fr 2fr; gap: 24px; margin-bottom: 16px;
    align-items: center;
  }
  .hero-left { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .hero-score {
    font-size: 72px; font-weight: 800; line-height: 1;
    background: linear-gradient(135deg, #a78bfa, #e879f9);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .hero-label { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

  /* SVG gauge */
  .gauge-svg { overflow: visible; }

  /* KPI mini */
  .mini-kpis { display: flex; flex-direction: column; gap: 10px; }
  .mini-kpi {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-radius: 12px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  }
  .mini-kpi-label { font-size: 12px; color: var(--text-dim); }
  .mini-kpi-val { font-size: 20px; font-weight: 700; }

  /* Bottom status bar */
  .status-strip {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-radius: 12px;
    background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.06);
    margin-top: 12px;
  }
  .status-pill-sm {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--text-dim);
  }
  .pill-dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-green { background: #34d399; box-shadow: 0 0 5px rgba(52,211,153,0.6); }
  .dot-red { background: #f87171; box-shadow: 0 0 5px rgba(248,113,113,0.6); }
  .dot-yellow { background: #fbbf24; }
  .dot-gray { background: #6b7280; }

  /* Middle 3-col */
  .mid-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .mid-panel-title { font-size: 13px; font-weight: 600; color: var(--text); }

  /* Dist bar */
  .dist-wrap { margin-bottom: 8px; }
  .dist-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .dist-g { font-size: 11px; font-weight: 700; min-width: 16px; }
  .dist-bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .dist-fill { height: 100%; border-radius: 3px; transition: width 1s ease; }
  .dist-cnt { font-size: 10px; color: var(--text-dim); min-width: 20px; text-align: right; }

  /* Bar chart */
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bar-name { font-size: 11px; color: var(--text-dim); width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
  .bar-bg { flex: 1; height: 16px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s; }
  .bar-val { font-size: 11px; color: var(--text-dim); min-width: 36px; text-align: right; flex-shrink: 0; }

  /* Session card */
  .session-card {
    padding: 10px 14px; border-radius: 12px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    margin-bottom: 8px;
  }
  .session-meta { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .session-id { font-size: 11px; color: var(--accent-light); font-family: monospace; }
  .session-time { font-size: 10px; color: var(--text-dim); }
  .session-summary { font-size: 12px; color: rgba(240,230,255,0.65); line-height: 1.5; }

  /* Grade badge */
  .grade {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
  }
  .grade-A { background: rgba(52,211,153,0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.2); }
  .grade-B { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.2); }
  .grade-C { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
  .grade-D { background: rgba(249,115,22,0.15); color: #fb923c; border: 1px solid rgba(249,115,22,0.2); }
  .grade-F { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }

  /* Score table */
  .score-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .score-table th {
    text-align: left; padding: 8px 10px; font-size: 10px;
    text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .score-table td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .score-table tr:hover td { background: rgba(255,255,255,0.03); }
  .score-table td:first-child { color: rgba(240,230,255,0.7); font-size: 11px; }

  /* Grade filter */
  .grade-filter { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .grade-btn {
    padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-dim);
  }
  .grade-btn.active { background: rgba(167,139,250,0.2); border-color: rgba(167,139,250,0.4); color: var(--accent-light); }
  .grade-btn:hover { border-color: rgba(167,139,250,0.3); color: var(--text); }

  /* Score bar */
  .score-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .score-bar-bg { flex: 1; height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 2px; transition: width 0.8s; }
  .score-num { font-size: 13px; font-weight: 600; min-width: 28px; text-align: right; }

  /* Error cluster */
  .error-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 8px; background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.1);
    margin-bottom: 7px; font-size: 12px;
  }
  .e-dot { width: 7px; height: 7px; border-radius: 50%; background: #f87171; flex-shrink: 0; }
  .e-msg { flex: 1; color: rgba(240,230,255,0.7); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .e-cnt { font-weight: 600; color: #f87171; font-size: 10px; }

  /* Improvement */
  .improve-item {
    padding: 10px 12px; border-radius: 10px;
    background: rgba(167,139,250,0.06); border: 1px solid rgba(167,139,250,0.12);
    margin-bottom: 8px; font-size: 12px; color: rgba(240,230,255,0.75); line-height: 1.5;
  }

  /* Timeline */
  .tl-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px;
    border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
    margin-bottom: 8px; font-size: 12px;
  }
  .tl-time { font-size: 10px; color: var(--text-dim); white-space: nowrap; padding-top: 1px; min-width: 90px; }
  .tl-badge { padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .badge-nova { background: rgba(99,102,241,0.2); color: #818cf8; }
  .badge-overtone { background: rgba(56,189,248,0.2); color: #38bdf8; }
  .badge-session { background: rgba(167,139,250,0.2); color: #a78bfa; }
  .tl-content { flex: 1; color: rgba(240,230,255,0.75); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Scene mini */
  .scene-mini { margin-bottom: 10px; }
  .scene-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .scene-name { color: var(--text); }
  .scene-pct { color: var(--text-dim); }
  .scene-bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .scene-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent-light), var(--accent2)); transition: width 0.8s; }

  /* Service status */
  .service-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
    margin-bottom: 7px; font-size: 12px;
  }
  .srv-name { flex: 1; color: var(--text); }
  .srv-detail { font-size: 10px; color: var(--text-dim); }
  .srv-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Lock */
  .lock-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
    margin-bottom: 6px; font-size: 11px;
  }
  .lock-name { flex: 1; font-family: monospace; font-size: 10px; color: var(--text-dim); }
  .lock-badge { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
  .lock-on { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .lock-off { background: rgba(52,211,153,0.12); color: #34d399; }

  /* Component detail */
  .comp-section { margin-bottom: 14px; }
  .comp-section-title {
    font-size: 11px; font-weight: 600; color: var(--accent-light);
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    text-transform: uppercase; letter-spacing: 0.8px;
  }
  .comp-count-big { font-size: 24px; font-weight: 700; }
  .comp-name-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .comp-tag {
    padding: 2px 8px; border-radius: 10px; font-size: 10px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-dim);
  }

  /* Action btn big */
  .big-action-btn {
    width: 100%; padding: 14px 18px; border-radius: 12px; cursor: pointer;
    transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: var(--text); margin-bottom: 10px; text-align: left;
    display: flex; align-items: center; gap: 12px;
  }
  .big-action-btn:hover {
    background: rgba(167,139,250,0.12);
    border-color: rgba(167,139,250,0.3);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(124,58,237,0.2);
  }
  .btn-icon { font-size: 20px; }
  .btn-info { flex: 1; }
  .btn-name { font-size: 13px; font-weight: 600; }
  .btn-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* Toast */
  .toast {
    position: fixed; top: 20px; right: 20px; z-index: 9999;
    background: rgba(167,139,250,0.9); color: #1a0040;
    padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600;
    box-shadow: 0 8px 32px rgba(124,58,237,0.4);
    animation: toastIn 0.3s ease-out;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .behavior-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .beh-label { font-size: 12px; color: rgba(240,230,255,0.7); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .beh-bar-bg { width: 80px; height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; }
  .beh-bar-fill { height: 100%; border-radius: 2px; background: var(--accent-light); transition: width 0.8s; }
  .beh-pct { font-size: 10px; color: var(--text-dim); min-width: 30px; text-align: right; }

  .empty-state { text-align: center; padding: 20px; color: var(--text-dim); font-size: 12px; }
  .col-title { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px; }

  @media (max-width: 1100px) {
    .hero-section { grid-template-columns: 1fr; }
    .grid-3-col, .grid-col-2-1, .grid-col-1-2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 768px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<canvas class="micro-particles" id="micro-canvas"></canvas>

<div class="app">
  <a href="/gallery.html" class="back-link">← Gallery</a>

  <div class="page-header">
    <div class="title-wrap">
      <div class="title-icon">⬡</div>
      <div class="page-title">
        <h1>Nova Intelligence</h1>
        <div class="page-subtitle">Hybrid Pro · Liquid Glass Fusion</div>
      </div>
    </div>
    <div class="header-right">
      <div class="label">系統時間</div>
      <div id="clock">--:--:--</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab" data-tab="panorama">全景</button>
    <button class="tab" data-tab="analysis">深度分析</button>
    <button class="tab" data-tab="log">活動日誌</button>
    <button class="tab" data-tab="control">控制中心</button>
    <button class="tab" data-tab="tab-notes">會議記錄</button>
  </div>

  <!-- Tab 1: 全景 -->
  <div id="panorama" class="tab-content">
    <!-- Hero -->
    <div class="panel" style="margin-bottom:16px">
      <div class="hero-section">
        <div class="hero-left">
          <svg class="gauge-svg" width="160" height="100" viewBox="0 0 160 100">
            <path d="M 20 80 A 60 60 0 0 1 140 80" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="12" stroke-linecap="round"/>
            <path id="gauge-arc" d="M 20 80 A 60 60 0 0 1 140 80" fill="none" stroke="url(#gaugeGrad)" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="0 188"/>
            <defs>
              <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#7c3aed"/>
                <stop offset="50%" stop-color="#e879f9"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>

<!-- Micro particles -->
<script>
(function() {
  const canvas = document.getElementById('micro-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, ps = [];
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  for (let i = 0; i < 15; i++) {
    ps.push({
      x: Math.random() * W, y: Math.random() * H + H,
      r: Math.random() * 2 + 2,
      speed: Math.random() * 0.4 + 0.15,
      opacity: Math.random() * 0.1 + 0.05,
    });
  }

  function draw() {
    requestAnimationFrame(draw);
    ctx.clearRect(0, 0, W, H);
    for (const p of ps) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(167,139,250,${p.opacity})`;
      ctx.fill();
      p.y -= p.speed;
      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    }
  }
  draw();
})();
</script>

<script>
function gradeFrom(s) {
  if (s >= 90) return 'A'; if (s >= 80) return 'B';
  if (s >= 70) return 'C'; if (s >= 60) return 'D'; return 'F';
}
function scoreBarColor(s) {
  if (s >= 90) return '#34d399'; if (s >= 70) return '#60a5fa';
  if (s >= 50) return '#fbbf24'; return '#f87171';
}

function animateCount(el, target) {
  const start = performance.now();
  (function update(now) {
    const p = Math.min((now - start) / 1000, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(e * target);
    if (p < 1) requestAnimationFrame(update);
  })(performance.now());
}

// ---- Tab 1 ----
function renderHero(data) {
  const scores = data.scores;
  const errors = data.errors;
  const components = data.components;
  const health = data.health;

  // Gauge
  const avg = scores && scores.length
    ? scores.reduce((s, x) => s + (x.total||x.score||0), 0) / scores.length : 0;
  const errCount = errors ? errors.length : 0;
  const healthScore = Math.round(avg * 0.7 + Math.max(0, 100 - errCount * 8) * 0.3);

  const heroEl = document.getElementById('hero-score');
  if (heroEl) animateCount(heroEl, healthScore);

  // Animate gauge arc
  const arc = document.getElementById('gauge-arc');
  if (arc) {
    const total = 188;
    const dash = (healthScore / 100 * total).toFixed(1);
    setTimeout(() => { arc.style.transition = 'stroke-dasharray 1.2s ease'; arc.setAttribute('stroke-dasharray', `${dash} ${total}`); }, 100);
  }

  const qEl = document.getElementById('kpi-quality');
  const eEl = document.getElementById('kpi-errors');
  const cEl = document.getElementById('kpi-comps');
  if (qEl) animateCount(qEl, Math.round(avg));
  if (eEl) animateCount(eEl, errCount);
  if (cEl && components) {
    const total = components.rules + components.skills + components.agents + components.hooks;
    animateCount(cEl, total);
  }

  // Status strip
  const ok = health && health.status === 'ok';
  const llmOk = data.llm?.status === 'online';
  const ss = document.getElementById('hero-status');
  if (ss) {
    ss.innerHTML = `
      <div class="status-pill-sm"><div class="pill-dot ${ok ? 'dot-green' : 'dot-red'}"></div>Server ${ok ? 'Online' : 'Offline'}</div>
      <div class="status-pill-sm"><div class="pill-dot ${llmOk ? 'dot-green' : 'dot-red'}"></div>LLM ${llmOk ? (data.llm?.model || 'Online') : '離線'}</div>
    `;
  }
}

function renderHeroDist(data) {
  const el = document.getElementById('hero-dist');
  if (!el) return;
  const scores = data.scores;
  if (!scores || !scores.length) { el.innerHTML = '<div class="empty-state">資料不可用</div>'; return; }
  const counts = { A:0, B:0, C:0, D:0, F:0 };
  scores.forEach(s => counts[gradeFrom(s.total||s.score||0)]++);
  const total = scores.length;
  const colors = { A:'#34d399', B:'#60a5fa', C:'#fbbf24', D:'#fb923c', F:'#f87171' };
  el.innerHTML = Object.entries(counts).map(([g, cnt]) => {
    const pct = total ? (cnt/total*100).toFixed(1) : 0;
    return `<div class="dist-row">
      <div class="dist-g" style="color:${colors[g]}">${g}</div>
      <div class="dist-bar"><div class="dist-fill" style="width:${pct}%;background:${colors[g]}"></div></div>
      <div class="dist-cnt">${cnt}</div>
    </div>`;
  }).join('');
}

function renderAnalysisTable(scores, filterGrade) {
  const tbody = document.getElementById('analysis-tbody');
  if (!tbody || !scores) { if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="empty-state">資料不可用</td></tr>'; return; }
  let filtered = scores;
  if (filterGrade && filterGrade !== '全部') filtered = scores.filter(s => gradeFrom(s.total||s.score||0) === filterGrade);
  filtered = [...filtered].sort((a,b)=>(b.total||b.score||0)-(a.total||a.score||0));
  const maxScore = filtered[0] ? (filtered[0].total||filtered[0].score||100) : 100;
  tbody.innerHTML = filtered.map(s => {
    const sc = s.total||s.score||0; const g = gradeFrom(sc); const color = scoreBarColor(sc);
    const name = (s.path||s.name||'').split('/').pop().replace('.md','').replace('.js','');
    return `<tr>
      <td title="${s.path||s.name}">${name}</td>
      <td><div class="score-bar-wrap">
        <div class="score-bar-bg"><div class="score-bar-fill" style="width:${(sc/maxScore*100).toFixed(1)}%;background:${color}"></div></div>
        <span class="score-num" style="color:${color}">${sc}</span>
      </div></td>
      <td><span class="grade grade-${g}">${g}</span></td>
      <td style="font-size:11px;color:var(--text-dim)">${s.type||s.category||'-'}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="4" class="empty-state">無符合資料</td></tr>';
}

// ---- Markdown renderer ----
function renderMarkdown(md) {
  return md
    .replace(/^# (.+)$/gm, '<h2 style="color:var(--accent-light,#a78bfa);margin:16px 0 8px;">$1</h2>')
    .replace(/^## (.+)$/gm, '<h3 style="color:var(--text,#f0e6ff);margin:14px 0 6px;font-size:15px;">$1</h3>')
    .replace(/^### (.+)$/gm, '<h4 style="color:var(--text-dim);margin:10px 0 4px;font-size:13px;">$1</h4>')
    .replace(/^> (.+)$/gm, '<div style="color:#6b7280;font-style:italic;border-left:3px solid #2d2d44;padding-left:12px;margin:8px 0;">$1</div>')
    .replace(/^- (.+)$/gm, '<div style="padding-left:16px;margin:2px 0;">• $1</div>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code style="background:rgba(124,58,237,0.15);padding:1px 4px;border-radius:3px;font-size:12px;">$1</code>')
    .replace(/^---$/gm, '<hr style="border:none;border-top:1px solid #2d2d44;margin:16px 0;">')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

async function clearLocks() {
  const r = await postApi('actions/clear-locks');
  if (r) showToast(`已清除 ${(r.cleared||[]).length} 個 Lock ✅`);
}
async function doAction(act) {
  const r = await postApi(`actions/${act}`);
  if (r) showToast(r.triggered ? '已觸發 ✅' : r.reloaded ? '已重載 ✅' : JSON.stringify(r));
}
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ---- Render all ----
function render(data) {
  // Tab 1
  renderHero(data);
  renderHeroDist(data);
  renderHeroScripts(data);
  renderHeroSessions(data);

  // Tab 2
  renderAnalysisTable(data.scores, '全部');
  initGradeFilter(data.scores);
  renderAnalysisErrors(data);
  renderAnalysisImprovements(data);
  renderAnalysisBehaviors(data);

  // Tab 3
  renderUnifiedLog(data);
  renderLogScenes(data);

  // Tab 4
  renderCtrlServices(data);
  renderCtrlLocks(data);
  renderCtrlComponents(data);

  // Tab 5
  const notesEl = document.getElementById('meeting-notes');
  if (notesEl) {
    const notes = generateMeetingNotes(data);
    const decisions = generateDecisionSummary(data);
    notesEl.innerHTML = renderMarkdown(notes + '\n\n' + decisions);
  }
}

// ---- Init ----
async function init() {
  const data = await loadAllData();
  render(data);
}
onDataUpdate(render);
init();
</script>

<script src="/nav-bar.js"></script>
</body>
